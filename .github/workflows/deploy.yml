name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # or 'master' if that's your default
  workflow_dispatch:
  schedule:
    # Refresh the Spotify top-10 (and redeploy) every 6 hours. This is what
    # makes the song list update on its own — cron times are UTC.
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # LFS is no longer needed — videos ship as small committed WebM/MP4
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # Validates the repo's Pages configuration up front — fails fast with a
      # clear error if Pages isn't set to deploy from GitHub Actions.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      # Refresh Andy's top 10 from Spotify into public/data/top-tracks.json.
      # Uses OAuth secrets (the client secret stays server-side, never shipped
      # to the browser). If the secrets aren't set, the script logs a notice and
      # exits 0, so the build still succeeds with the last-good committed JSON.
      - name: Refresh Spotify top tracks
        run: node tools/spotify-data/fetch-top-tracks.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # Personal NASA API key (raises the NeoWs limit above DEMO_KEY's
          # ~30 req/hr). Add it under Settings → Secrets and variables →
          # Actions → New repository secret, named VITE_NASA_API_KEY.
          VITE_NASA_API_KEY: ${{ secrets.VITE_NASA_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

concurrency:
  group: "pages"
  cancel-in-progress: true