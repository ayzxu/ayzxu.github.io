name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # or 'master' if that's your default
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # LFS is no longer needed — videos ship as small committed WebM/MP4
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # Validates the repo's Pages configuration up front — fails fast with a
      # clear error if Pages isn't set to deploy from GitHub Actions.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Personal NASA API key (raises the NeoWs limit above DEMO_KEY's
          # ~30 req/hr). Add it under Settings → Secrets and variables →
          # Actions → New repository secret, named VITE_NASA_API_KEY.
          VITE_NASA_API_KEY: ${{ secrets.VITE_NASA_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

concurrency:
  group: "pages"
  cancel-in-progress: true